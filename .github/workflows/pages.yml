name: Publish website preview

on:
  push:
    branches: [main]
    paths:
      - 'static/**'
      - 'scripts/build_web_preview.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out current version
        uses: actions/checkout@v6
      - name: Check frontend syntax
        run: node --check static/app.js
      - name: Build the public preview
        run: python3 scripts/build_web_preview.py
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload only public website files
        uses: actions/upload-pages-artifact@v4
        with:
          path: web-preview
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
